<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Banjhade</title>
<style>
  :root{
    --sky-top:#7EC8E3;
    --sky-bottom:#CDEAF0;
    --peak-far:#B7C9D6;
    --peak-near:#8FA6B3;
    --ground-top:#C9A876;
    --ground-bottom:#A9824F;
    --bamboo:#4E9A51;
    --bamboo-dark:#397A3C;
    --bamboo-ring:#2E5F30;
    --ink:#2B2320;
    --paper:#FBF3E3;
    --accent:#E0632B;
    --accent-dark:#B84B1D;
    --shadow:rgba(43,35,32,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:#1c1b1a;
    touch-action:manipulation;
    user-select:none;
  }
  #stage{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#1c1b1a;
  }
  #gameWrap{
    position:relative;
    box-shadow:0 20px 60px var(--shadow);
    border-radius:10px;
    overflow:hidden;
    max-height:100vh;
    max-width:100vw;
  }
  canvas{display:block;background:linear-gradient(var(--sky-top),var(--sky-bottom));}

  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    color:var(--ink);
    padding:24px;
    background:rgba(0,0,0,0.0);
    transition:opacity .25s ease;
  }
  .hidden{display:none !important;}

  .panel{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:16px;
    padding:22px 28px;
    box-shadow:0 10px 0 var(--ink), 0 14px 30px rgba(0,0,0,0.35);
    max-width:88%;
  }
  .title{
    font-size:clamp(26px,6vw,40px);
    font-weight:800;
    color:var(--accent-dark);
    letter-spacing:1px;
    margin:0 0 4px 0;
    text-shadow:2px 2px 0 rgba(255,255,255,0.5);
  }
  .subtitle{
    font-size:clamp(12px,3vw,15px);
    color:var(--ink);
    opacity:0.75;
    margin:0 0 16px 0;
  }
  .btn{
    display:inline-block;
    font-family:inherit;
    font-size:clamp(16px,4vw,20px);
    font-weight:700;
    color:#fff;
    background:var(--accent);
    border:none;
    border-bottom:4px solid var(--accent-dark);
    border-radius:10px;
    padding:12px 28px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
    letter-spacing:0.5px;
  }
  .btn:active{transform:translateY(3px);border-bottom-width:1px;}
  .btn:hover{filter:brightness(1.06);}

  .scoreRow{
    display:flex;gap:22px;justify-content:center;margin:14px 0 18px 0;
  }
  .scoreBox{
    background:rgba(43,35,32,0.06);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:8px 16px;
    min-width:84px;
  }
  .scoreBox .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:0.65;}
  .scoreBox .value{font-size:24px;font-weight:800;color:var(--accent-dark);}

  #hud{
    position:absolute;top:14px;left:0;right:0;
    display:flex;justify-content:center;
    pointer-events:none;
    z-index:5;
  }
  #hudScore{
    font-size:clamp(34px,9vw,52px);
    font-weight:800;
    color:#fff;
    -webkit-text-stroke:3px var(--ink);
    text-shadow:0 4px 0 rgba(0,0,0,0.25);
  }

  #muteBtn{
    position:absolute;top:12px;right:12px;
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(43,35,32,0.55);
    border:2px solid rgba(255,255,255,0.6);
    color:#fff;font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:10;
  }

  .credit{
    position:absolute;bottom:6px;right:10px;
    font-size:10px;color:rgba(43,35,32,0.4);
    z-index:5;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="hud"><div id="hudScore">0</div></div>
    <button id="muteBtn" title="Mute/unmute">🔊</button>

    <div id="startScreen" class="overlay">
      <div class="panel">
        <h1 class="title">Flappy Banjhade</h1>
        <p class="subtitle">Tap, click, or press Space to flap</p>
        <button id="startBtn" class="btn">Start Game</button>
        <div class="subtitle" style="margin-top:14px;">Best: <span id="bestPreview">0</span></div>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="panel">
        <h1 class="title" style="color:var(--accent-dark);">Game Over</h1>
        <div class="scoreRow">
          <div class="scoreBox">
            <div class="label">Score</div>
            <div class="value" id="finalScore">0</div>
          </div>
          <div class="scoreBox">
            <div class="label">Best</div>
            <div class="value" id="bestScore">0</div>
          </div>
        </div>
        <button id="restartBtn" class="btn">Play Again</button>
      </div>
    </div>

    <div class="credit">Flappy Banjhade</div>
  </div>
</div>

<script>
/* =========================================================================
   ASSET / AUDIO CONFIGURATION
   -------------------------------------------------------------------------
   Everything that points at an external file lives here. Drop the files
   into the same GitHub repo root as this HTML file (or edit the paths
   below to point wherever you keep them) and the game will pick them up
   automatically — no other code needs to change.
   ========================================================================= */
const CONFIG = {

  // ---- Player sprite -----------------------------------------------------
  PLAYER_IMAGE_SRC: "FB_IMG_1787569230652.jpg",   // uploaded photo, stored at repo root

  // The original photo is 1016 x 1536 px. HEAD_CROP describes the
  // rectangle (in the ORIGINAL image's pixel coordinates) that contains
  // just the head — hair, face, ears — with the torso/shirt excluded.
  // These are approximate starting values (~580 x 900 px, roughly centered
  // horizontally, starting near the top of the frame); nudge x/y/width/
  // height here if the crop needs to shift once you see it rendered.
  HEAD_CROP: {
    x: 218,     // left edge of the crop, in source-image pixels
    y: 60,      // top edge of the crop, in source-image pixels
    width: 580, // crop width
    height: 900 // crop height
  },

  // Final on-screen size of the player sprite (px). Aspect ratio of
  // HEAD_CROP is preserved automatically — this just sets the height,
  // width is derived to keep the crop's proportions.
  PLAYER_DISPLAY_SIZE: 76,        // ~70-80px as requested

  // Shrinks the collision box relative to the drawn sprite (0-1). A value
  // below 1 gives the player a bit of grace so near-misses feel fair,
  // while still colliding against the visible head art, not empty canvas.
  PLAYER_HITBOX_SCALE: 0.82,

  // ---- Audio ---------------------------------------------------------
  AUDIO: {
    BACKGROUND: "background",  // loops continuously while playing
    START:      "start.mp3",       // plays once when a run begins
    END:        "end.mp3",         // plays once immediately on game over
    BACKGROUND_VOLUME: 0.5,
    START_VOLUME: 0.8,
    END_VOLUME: 0.8
  },

  // ---- Physics / gameplay tuning -----------------------------------------
  GRAVITY: 1500,          // px/s^2
  FLAP_VELOCITY: -430,    // px/s, instantaneous upward velocity on flap
  MAX_FALL_SPEED: 700,    // px/s terminal velocity
  ROTATION_UP: -25,       // degrees, sprite tilt while rising
  ROTATION_DOWN: 90,      // degrees, sprite tilt while diving

  PIPE_WIDTH: 78,
  PIPE_GAP_START: 190,       // vertical gap between top/bottom pipe at start
  PIPE_GAP_MIN: 140,         // gap never shrinks past this (difficulty cap)
  PIPE_GAP_SHRINK_PER_SCORE: 1.4, // gap shrinks slightly as score rises
  PIPE_SPACING: 260,         // horizontal distance between pipe pairs
  PIPE_SPEED_START: 190,     // px/s
  PIPE_SPEED_MAX: 340,       // px/s difficulty cap
  PIPE_SPEED_GAIN_PER_SCORE: 3, // speed increase per point scored

  GROUND_HEIGHT: 90,
  GROUND_SPEED_FACTOR: 1.0,  // ground scrolls at pipe speed * this factor

  CANVAS_WIDTH: 400,
  CANVAS_HEIGHT: 640
};

/* ========================================================================= */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameWrap = document.getElementById('gameWrap');
const hudScoreEl = document.getElementById('hudScore');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');
const bestPreviewEl = document.getElementById('bestPreview');
const muteBtn = document.getElementById('muteBtn');

canvas.width = CONFIG.CANVAS_WIDTH;
canvas.height = CONFIG.CANVAS_HEIGHT;

/* ---------------------------------------------------------------------
   Responsive scaling — keeps the fixed internal resolution but fits the
   canvas element to whatever viewport it's shown in (desktop or mobile).
--------------------------------------------------------------------- */
function fitToScreen(){
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const scale = Math.min(maxW / CONFIG.CANVAS_WIDTH, maxH / CONFIG.CANVAS_HEIGHT, 1.15);
  const w = CONFIG.CANVAS_WIDTH * scale;
  const h = CONFIG.CANVAS_HEIGHT * scale;
  gameWrap.style.width = w + 'px';
  gameWrap.style.height = h + 'px';
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

/* ---------------------------------------------------------------------
   Audio setup — all playback funnels through this small wrapper so mute/
   volume/loop behavior stays consistent and centralized.
--------------------------------------------------------------------- */
const sounds = {
  background: new Audio(CONFIG.AUDIO.BACKGROUND),
  start: new Audio(CONFIG.AUDIO.START),
  end: new Audio(CONFIG.AUDIO.END)
};
sounds.background.loop = true;
sounds.background.volume = CONFIG.AUDIO.BACKGROUND_VOLUME;
sounds.start.volume = CONFIG.AUDIO.START_VOLUME;
sounds.end.volume = CONFIG.AUDIO.END_VOLUME;
// Missing/unavailable audio files should never break gameplay.
Object.values(sounds).forEach(a => a.addEventListener('error', () => {}));

let muted = false;
function playSound(a){
  if (muted) return;
  try { a.currentTime = 0; a.play().catch(()=>{}); } catch(e){}
}
function startBackgroundMusic(){
  if (muted) return;
  try { sounds.background.currentTime = 0; sounds.background.play().catch(()=>{}); } catch(e){}
}
function stopBackgroundMusic(){
  try { sounds.background.pause(); sounds.background.currentTime = 0; } catch(e){}
}
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (muted) stopBackgroundMusic();
  else if (state === STATE.PLAYING) startBackgroundMusic();
});

/* ---------------------------------------------------------------------
   Player sprite — crop just the head out of the uploaded photo at load
   time using CONFIG.HEAD_CROP, then draw only that crop for the game
   (both visually and for collision).
--------------------------------------------------------------------- */
const sourceImage = new Image();
sourceImage.src = CONFIG.PLAYER_IMAGE_SRC;

let headSprite = null;      // offscreen canvas holding the cropped head
let headReady = false;
let spriteDrawW = CONFIG.PLAYER_DISPLAY_SIZE;
let spriteDrawH = CONFIG.PLAYER_DISPLAY_SIZE;

sourceImage.onload = () => {
  const c = CONFIG.HEAD_CROP;
  const off = document.createElement('canvas');
  off.width = c.width;
  off.height = c.height;
  const octx = off.getContext('2d');
  octx.drawImage(sourceImage, c.x, c.y, c.width, c.height, 0, 0, c.width, c.height);
  headSprite = off;
  headReady = true;

  const aspect = c.width / c.height;
  spriteDrawH = CONFIG.PLAYER_DISPLAY_SIZE;
  spriteDrawW = CONFIG.PLAYER_DISPLAY_SIZE * aspect;
};
sourceImage.onerror = () => {
  // Fallback: game stays fully playable with a simple drawn avatar if the
  // photo isn't present yet at CONFIG.PLAYER_IMAGE_SRC.
  headReady = false;
};

/* ---------------------------------------------------------------------
   Game state
--------------------------------------------------------------------- */
const STATE = { START: 'start', PLAYING: 'playing', GAMEOVER: 'gameover' };
let state = STATE.START;

let best = 0;
try { best = parseInt(localStorage.getItem('flappyBanjhadeBest') || '0', 10) || 0; } catch(e){ best = 0; }
bestPreviewEl.textContent = best;

let player, pipes, score, groundOffset, elapsed, lastTime, bgOffset;

function resetGame(){
  player = {
    x: CONFIG.CANVAS_WIDTH * 0.3,
    y: CONFIG.CANVAS_HEIGHT / 2,
    vy: 0,
    rotation: 0
  };
  pipes = [];
  score = 0;
  groundOffset = 0;
  bgOffset = 0;
  elapsed = 0;
  spawnPipe(CONFIG.CANVAS_WIDTH + 60);
  hudScoreEl.textContent = '0';
}

function currentPipeGap(){
  const shrink = score * CONFIG.PIPE_GAP_SHRINK_PER_SCORE;
  return Math.max(CONFIG.PIPE_GAP_MIN, CONFIG.PIPE_GAP_START - shrink);
}
function currentPipeSpeed(){
  const gain = score * CONFIG.PIPE_SPEED_GAIN_PER_SCORE;
  return Math.min(CONFIG.PIPE_SPEED_MAX, CONFIG.PIPE_SPEED_START + gain);
}

function spawnPipe(atX){
  const gap = currentPipeGap();
  const margin = 60;
  const playH = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;
  const gapCenter = margin + Math.random() * (playH - margin * 2 - gap) + gap / 2;
  pipes.push({
    x: atX,
    gapCenter: gapCenter,
    gap: gap,
    scored: false
  });
}

/* ---------------------------------------------------------------------
   Input
--------------------------------------------------------------------- */
function flap(){
  if (state === STATE.PLAYING){
    player.vy = CONFIG.FLAP_VELOCITY;
  }
}

function handlePrimaryInput(e){
  if (e) e.preventDefault();
  if (state === STATE.START){
    beginGame();
  } else if (state === STATE.PLAYING){
    flap();
  } else if (state === STATE.GAMEOVER){
    // ignore taps on the canvas itself during game over; the button handles restart
  }
}

canvas.addEventListener('pointerdown', handlePrimaryInput);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    handlePrimaryInput(null);
  }
});
startBtn.addEventListener('click', beginGame);
restartBtn.addEventListener('click', beginGame);

/* ---------------------------------------------------------------------
   State transitions
--------------------------------------------------------------------- */
function beginGame(){
  resetGame();
  state = STATE.PLAYING;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  playSound(sounds.start);
  startBackgroundMusic();
  lastTime = performance.now();
  if (!rafId) rafId = requestAnimationFrame(loop);
}

function endGame(){
  state = STATE.GAMEOVER;
  stopBackgroundMusic();
  playSound(sounds.end);
  if (score > best){
    best = score;
    try { localStorage.setItem('flappyBanjhadeBest', String(best)); } catch(e){}
  }
  finalScoreEl.textContent = score;
  bestScoreEl.textContent = best;
  bestPreviewEl.textContent = best;
  gameOverScreen.classList.remove('hidden');
}

/* ---------------------------------------------------------------------
   Update
--------------------------------------------------------------------- */
function update(dt){
  elapsed += dt;
  const speed = currentPipeSpeed();

  // player physics
  player.vy += CONFIG.GRAVITY * dt;
  if (player.vy > CONFIG.MAX_FALL_SPEED) player.vy = CONFIG.MAX_FALL_SPEED;
  player.y += player.vy * dt;

  const targetRot = player.vy < 0 ? CONFIG.ROTATION_UP : Math.min(CONFIG.ROTATION_DOWN, player.vy * 0.12);
  player.rotation += (targetRot - player.rotation) * Math.min(1, dt * 10);

  // ground scroll
  groundOffset = (groundOffset + speed * dt) % 40;
  bgOffset = (bgOffset + speed * 0.25 * dt) % CONFIG.CANVAS_WIDTH;

  // pipes
  for (const p of pipes){
    p.x -= speed * dt;
  }
  while (pipes.length && pipes[0].x < -CONFIG.PIPE_WIDTH){
    pipes.shift();
  }
  const lastPipe = pipes[pipes.length - 1];
  if (!lastPipe || (CONFIG.CANVAS_WIDTH - lastPipe.x) >= CONFIG.PIPE_SPACING){
    spawnPipe(CONFIG.CANVAS_WIDTH + 20);
  }

  // scoring — pass the pipe's trailing edge
  const playerCenterX = player.x;
  for (const p of pipes){
    if (!p.scored && (p.x + CONFIG.PIPE_WIDTH) < playerCenterX){
      p.scored = true;
      score++;
      hudScoreEl.textContent = score;
    }
  }

  checkCollisions();
}

function playerHitbox(){
  const w = spriteDrawW * CONFIG.PLAYER_HITBOX_SCALE;
  const h = spriteDrawH * CONFIG.PLAYER_HITBOX_SCALE;
  return {
    left: player.x - w / 2,
    right: player.x + w / 2,
    top: player.y - h / 2,
    bottom: player.y + h / 2
  };
}

function checkCollisions(){
  const box = playerHitbox();
  const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;

  // ground
  if (box.bottom >= groundY){
    player.y = groundY - (spriteDrawH * CONFIG.PLAYER_HITBOX_SCALE) / 2;
    endGame();
    return;
  }
  // ceiling — treat as a forbidden boundary too
  if (box.top <= 0){
    box.top = 0;
    player.y = (spriteDrawH * CONFIG.PLAYER_HITBOX_SCALE) / 2;
    player.vy = 0;
  }

  // pipes
  for (const p of pipes){
    const withinX = box.right > p.x && box.left < p.x + CONFIG.PIPE_WIDTH;
    if (!withinX) continue;
    const gapTop = p.gapCenter - p.gap / 2;
    const gapBottom = p.gapCenter + p.gap / 2;
    const hitsTopPipe = box.top < gapTop;
    const hitsBottomPipe = box.bottom > gapBottom;
    if (hitsTopPipe || hitsBottomPipe){
      endGame();
      return;
    }
  }
}

/* ---------------------------------------------------------------------
   Draw
--------------------------------------------------------------------- */
function drawBackground(){
  // sky gradient is set via CSS on the canvas background; draw mountains + clouds
  ctx.save();

  // far mountains
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--peak-far').trim();
  drawMountainRange(CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT - 30, 70, 0.5, bgOffset * 0.4);

  // near mountains
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--peak-near').trim();
  drawMountainRange(CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT - 5, 100, 0.7, bgOffset * 0.8);

  ctx.restore();
}

function drawMountainRange(baseY, amp, freqScale, offset){
  const w = CONFIG.CANVAS_WIDTH;
  ctx.beginPath();
  ctx.moveTo(-40, baseY);
  const step = 40;
  for (let x = -40; x <= w + 40; x += step){
    const px = x + offset;
    const peak = baseY - amp * (0.5 + 0.5 * Math.sin(px * 0.02 * freqScale) * Math.sin(px * 0.007));
    ctx.lineTo(x, peak);
  }
  ctx.lineTo(w + 40, CONFIG.CANVAS_HEIGHT);
  ctx.lineTo(-40, CONFIG.CANVAS_HEIGHT);
  ctx.closePath();
  ctx.fill();
}

function drawPipes(){
  const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;
  for (const p of pipes){
    const gapTop = p.gapCenter - p.gap / 2;
    const gapBottom = p.gapCenter + p.gap / 2;
    drawBambooStalk(p.x, 0, CONFIG.PIPE_WIDTH, gapTop, true);
    drawBambooStalk(p.x, gapBottom, CONFIG.PIPE_WIDTH, groundY - gapBottom, false);
  }
}

function drawBambooStalk(x, y, w, h, isTop){
  if (h <= 0) return;
  ctx.save();
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, '#5CAE5E');
  grad.addColorStop(0.5, getComputedStyle(document.documentElement).getPropertyValue('--bamboo').trim());
  grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--bamboo-dark').trim());
  ctx.fillStyle = grad;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bamboo-ring').trim();
  ctx.lineWidth = 3;

  ctx.beginPath();
  roundRectPath(ctx, x, y, w, h, 6);
  ctx.fill();
  ctx.stroke();

  // bamboo rings
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bamboo-ring').trim();
  ctx.lineWidth = 3;
  const ringSpacing = 34;
  ctx.globalAlpha = 0.6;
  const start = isTop ? h % ringSpacing : 0;
  for (let ry = y + start; ry < y + h; ry += ringSpacing){
    ctx.beginPath();
    ctx.moveTo(x + 4, ry);
    ctx.lineTo(x + w - 4, ry);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // lip near the gap
  const lipH = 22;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bamboo-dark').trim();
  const lipY = isTop ? y + h - lipH : y;
  ctx.beginPath();
  roundRectPath(ctx, x - 5, lipY, w + 10, lipH, 6);
  ctx.fill();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bamboo-ring').trim();
  ctx.stroke();

  ctx.restore();
}

function roundRectPath(c, x, y, w, h, r){
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
}

function drawGround(){
  const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;
  const grad = ctx.createLinearGradient(0, groundY, 0, CONFIG.CANVAS_HEIGHT);
  grad.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--ground-top').trim());
  grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--ground-bottom').trim());
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, CONFIG.CANVAS_WIDTH, CONFIG.GROUND_HEIGHT);

  // scrolling texture stripes
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  const w = 40;
  for (let x = -groundOffset; x < CONFIG.CANVAS_WIDTH; x += w){
    ctx.fillRect(x, groundY, w / 2, CONFIG.GROUND_HEIGHT);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, groundY, CONFIG.CANVAS_WIDTH, 4);
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.rotation * Math.PI / 180);

  if (headReady && headSprite){
    ctx.drawImage(headSprite, -spriteDrawW / 2, -spriteDrawH / 2, spriteDrawW, spriteDrawH);
  } else {
    // Fallback avatar so the game is fully playable without the photo present.
    ctx.fillStyle = '#F2C48D';
    ctx.beginPath();
    ctx.arc(0, 0, CONFIG.PLAYER_DISPLAY_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a5a2b';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  drawBackground();
  drawPipes();
  drawGround();
  drawPlayer();
}

/* ---------------------------------------------------------------------
   Main loop
--------------------------------------------------------------------- */
let rafId = null;
function loop(now){
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  if (state === STATE.PLAYING){
    update(dt);
  }
  render();

  rafId = requestAnimationFrame(loop);
}

// Idle preview render before the game starts
resetGame();
lastTime = performance.now();
render();
rafId = requestAnimationFrame(loop);
</script>
